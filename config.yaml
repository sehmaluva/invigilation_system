# ------------------------------------------------------------------
# AI-Assisted Exam Invigilation Support System - settings
# Edit this file, then restart the server.
# ------------------------------------------------------------------

server:
  data_dir: data                 # database, clips and thumbnails go here
  default_admin_user: admin      # created on first start - CHANGE the password
  default_admin_password: admin123

detector:                        # YOLOv8 person detector + ByteTrack
  weights: yolov8n.pt            # downloaded automatically on first run
  conf: 0.30                     # notebook YOLO_CONF (Try-it video uses 0.3)
  imgsz: 640
  tracker: bytetrack.yaml
  device: auto                   # auto | cpu | 0 (first GPU)

pipeline:
  process_fps: 3                 # frames analysed per second (notebook TRY_FPS)
  max_frame_width: 0             # inference only. 0 = full frame (matches Try-it)
  preview_max_width: 960         # JPEG preview only; inference stays full resolution
  preview_jpeg_quality: 60
  preview_max_fps: 30            # cap on how often the preview is re-encoded
  realtime: true                 # files play at 1x. false = analyse sampled frames as fast as possible
  overlay_fresh_seconds: 1.0    # hide boxes that are older than this on the live picture
  torch_threads: 6               # keep CPU inference from starving the preview
  min_crop_px: 40                # ignore tiny person boxes

classifier:                      # notebook best.pt plugs in here
  model_path: models/best.pt     # if missing, a STUB model is used
  arch: efficientnet_b0          # used only when the checkpoint does not say arch
  input_size: 224                # overridden by the checkpoint when it stores input_size
  crop_pad: 0.0                  # Try-it scores the tight box. Training crops used 0.10.
  # Fallback only. A checkpoint's class_names / cheating_classes replace these,
  # so the cheating column is the one the notebook trained (index of "cheating").
  class_names: [normal, cheating]
  cheating_classes: [cheating]
  batch_size: 16
  stub:                          # STUB only: score rises when a person leans/stretches sideways
    ref_aspect: 0.75             # normal width/height of a seated person box
    gain: 6.0
    noise: 0.05

flagging:                        # temporal smoothing per tracked student (notebook Try-it)
  window_seconds: 3              # rolling-mean window (WINDOW_S)
  # Used when best.pt / metrics.json has no threshold. The notebook's tuned
  # threshold stored in the checkpoint is used instead when use_checkpoint_threshold is true.
  threshold: 0.5
  use_checkpoint_threshold: true
  min_duration_seconds: 2        # score must stay above threshold this long (MIN_DURATION_S)
  cooldown_seconds: 20           # no new flag for the same student during this time (COOLDOWN_S)
  track_lost_seconds: 3          # forget a student not seen for this long
  score_history_seconds: 180     # live chart: how much history to keep per track

clips:
  pre_seconds: 8                 # seconds kept before the flag (ring buffer)
  post_seconds: 3                # seconds recorded after the flag

review:
  alert_cap: 100                # max pending flags shown at once (highest score first)

retention:
  days: 14                       # clips/thumbnails older than this are deleted

stream:
  reconnect_seconds: 3           # wait before reconnecting a dropped phone stream
  max_reconnects: 20
